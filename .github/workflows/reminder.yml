name: Slack Reminder

on:
  schedule:
    # 每天早上 08:30 提醒一次（對應 UTC 時間 00:30）
    - cron: '30 0 * * 1-5'
    # 每天下午 17:00 提醒一次（對應 UTC 時間 09:00）
    - cron: '0 9 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 手動按按鈕測試

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python main.py
