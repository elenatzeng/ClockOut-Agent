name: Slack Reminder

on:
  schedule:
    # 每天早上 08:33 提醒（對應 UTC 時間 00:33）
    - cron: '33 0 * * 1-5'
    # 每天下午 17:33 提醒（對應 UTC 時間 09:33）
    - cron: '33 9 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 手動按按鈕測試

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run script
        env:
          USERNAME: ${{ secrets.ONE_ZERO_FOUR_USERNAME }}
          PASSWORD: ${{ secrets.ONE_ZERO_FOUR_PASSWORD }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python main.py
